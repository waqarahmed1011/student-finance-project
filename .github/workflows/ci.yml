name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/Workbench.Tests --configuration Release

      - name: Publish web app
        run: dotnet publish src/Workbench.Web --configuration Release --output publish

      - uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: publish

  # Runs only when the repo has an AZURE_WEBAPP_NAME variable and an
  # AZURE_WEBAPP_PUBLISH_PROFILE secret (see DEPLOY.md).
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: publish

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
